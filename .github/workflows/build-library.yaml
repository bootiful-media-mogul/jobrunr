name: Deploy

env:
  GH_TOKEN: ${{ secrets.MOGUL_GITHUB_PACKAGES_PERSONAL_ACCESS_TOKEN }}
  GH_USER: ${{ github.actor }}

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build Container
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v3

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.2'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Generate Maven settings.xml
        uses: s4u/maven-settings-action@v4.0.0
        with:
          servers: |
            [
              {
                "id": "github",
                "username": "${{ env.GH_USER }}",
                "password": "${{ env.GH_TOKEN }}"
              }
            ]
          repositories: |
            [
              {
                "id": "github",
                "name": "Mogul Github Artifacts",
                "url": "https://maven.pkg.github.com/bootiful-media-mogul/artifacts"
              }
            ]

#      - name: Maven settings for GitHub Packages
#        run: |
#          mkdir -p "$HOME/.m2"
#          cat > "$HOME/.m2/settings.xml" <<'EOF'
#          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
#            <servers>
#              <server>
#                <id>github</id>
#                <username>${env.GH_USER}</username>
#                <password>${env.GH_TOKEN}</password>
#              </server>
#            </servers>
#          </settings>
#          EOF
#
      - name: Deploy Package
        run:  mvn -s "$HOME/.m2/settings.xml" deploy