name: Deploy

env:
  GH_TOKEN: ${{ secrets.MOGUL_GITHUB_PACKAGES_PERSONAL_ACCESS_TOKEN }}
  GH_USER: ${{ github.actor }}

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build Container
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v3

      - name: Setup Build Environment
        uses: bootiful-media-mogul/setup-jvm-build-env/.github/actions/setup@main
        with:
          gh_token: ${{ env.GH_TOKEN }}
          gh_user: ${{ env.GH_USER }}

      - name: Deploy Package
        run: mvn deploy